apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mimir.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mimir.fullname" . }}-gossip-ring
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "mimir.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mimir.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          image: {{ .Values.image.repository }}:{{ include "mimir.version" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config.file=/etc/mimir/mimir.yaml"
            - "-config.expand-env=true"
            - "-target=all,ruler,alertmanager"
          env:
            - name: MIMIR_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.bucketConfigMap.name }}
                  key: {{ .Values.bucketConfigMap.bucketKey }}
            - name: MIMIR_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.clusterInfo.name }}
                  key: {{ .Values.clusterInfo.regionKey }}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
            - name: gossip
              containerPort: 7946
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        nodegroup: management-arm-rkt-mng
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: management
      volumes:
        - name: config
          configMap:
            name: {{ include "mimir.fullname" . }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.dataSize }}