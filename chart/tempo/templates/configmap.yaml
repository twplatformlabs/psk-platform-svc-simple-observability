apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tempo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    multitenancy_enabled: false
    usage_report:
      reporting_enabled: false

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095

    memberlist:
      join_members:
        - {{ include "tempo.fullname" . }}-gossip-ring.{{ .Release.Namespace }}.svc.cluster.local:7946

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: {{ .Values.maxBlockDuration }}

    compactor:
      compaction:
        block_retention: {{ .Values.retentionPeriod }}

    storage:
      trace:
        backend: s3
        s3:
          bucket: ${TEMPO_S3_BUCKET}
          endpoint: s3.${TEMPO_S3_REGION}.amazonaws.com
          region: ${TEMPO_S3_REGION}
        wal:
          path: {{ .Values.wal.mountPath }}/wal   # on the EFS PVC

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
        remote_write: []            # leave empty for Drilldown-only; add Mimir here for span-metrics/service-graphs
      traces_storage:
        path: /var/tempo/generator/traces   # local-blocks stores recent trace blocks here
      processor:
        local_blocks:
          filter_server_spans: false        # so rate() covers all spans, not just server spans
          flush_to_storage: true            # lets metrics queries reach historical data, not just the recent window

    overrides:
      defaults:
        metrics_generator:
          processors:
            - local-blocks          # the one Traces Drilldown needs