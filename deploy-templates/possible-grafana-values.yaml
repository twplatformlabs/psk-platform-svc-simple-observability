# grafana-values.yaml
# Grafana UI on EKS, pre-wired to the in-cluster Loki as its default datasource.
# ONE Loki datasource surfaces BOTH your container logs and the Kubernetes events:
#   - events are the {service_name="kubernetes-events"} stream
#   - container logs are everything else
#
# Chart:   grafana/grafana   (repo: https://grafana.github.io/helm-charts)
# Install: helm install grafana grafana/grafana -n observe -f grafana-values.yaml

# --- Loki datasource, provisioned declaratively (survives pod restarts) ---
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        # Same nginx gateway you push to; Grafana queries it at /loki/api/v1/*.
        url: http://loki-gateway.psk-system.svc.cluster.local
        isDefault: true
        jsonData:
          maxLines: 1000
          # --- Multi-tenant Loki only (auth_enabled: true) ---
          # httpHeaderName1: 'X-Scope-OrgID'
        # secureJsonData:
        #   httpHeaderValue1: 'my-tenant'

# --- Admin credentials ---
# Do NOT commit a password to Git. For GitOps/Argo, point at a Secret you manage
# (SealedSecrets / External Secrets), created BEFORE the first install:
# admin:
#   existingSecret: grafana-admin
#   userKey: admin-user
#   passwordKey: admin-password
# For a quick `helm install`, either pass --set adminPassword=... on the CLI or
# let the chart generate one and read it back (command in the chat).

# --- Persistence ---
# Ephemeral by default: the datasource is provisioned above, so a restart loses
# nothing essential. Enable to keep user-created dashboards / users / preferences
# (requires a default StorageClass, e.g. gp3 via the EBS CSI driver).
# NOTE: with persistence ON, the admin password is written to the DB on FIRST
# boot and later Secret changes are ignored — set it correctly up front.
persistence:
  enabled: false
  # enabled: true
  # size: 5Gi
  # storageClassName: gp3

# --- Access ---
# ClusterIP by default. Reach it with:
#   kubectl -n observe port-forward svc/grafana 3000:80   ->   http://localhost:3000
# To expose it, switch to an ALB Ingress or a LoadBalancer service below.
service:
  type: ClusterIP
# ingress:
#   enabled: true
#   ingressClassName: alb
#   hosts: [grafana.example.com]

# The chart's DEFAULT pod/container security context is already non-root and
# hardened (runAsNonRoot, uid/gid/fsGroup 472, drop: [ALL], seccomp RuntimeDefault),
# so it meets the 'restricted' PodSecurity Standard without overrides here.

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi