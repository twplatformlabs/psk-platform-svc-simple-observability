apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-external-secrets
  namespace: observe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-vault
  data:
    - secretKey: GF_AUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: svc-github-oauth-apps/psk-sbx-grafana-client-id
    - secretKey: GF_AUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: svc-github-oauth-apps/psk-sbx-grafana-client-secret
    - secretKey: GF_ADMIN_USERNAME
      remoteRef:
        key: app-simple-grafana/admin-username
    - secretKey: GF_ADMIN_PASSWORD
      remoteRef:
        key: app-simple-grafana/admin-password-sbx